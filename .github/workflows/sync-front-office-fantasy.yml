name: Sync Front Office Fantasy from Sleeper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: front-office-fantasy-sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Refresh Front Office Fantasy data
        run: python scripts/sync_front_office_fantasy.py
      - name: Commit changed Sleeper data
        run: |
          if [[ -z "$(git status --porcelain -- data/ reports/)" ]]; then
            echo "Sleeper data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "Refresh Front Office Fantasy Sleeper data"
          git push
